apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fp-validated-docs-repository
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: CHANGE_ME_SECRET_STORE
  target:
    name: fp-validated-docs-repository
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/FP-Validated/fp-validated-docs.git
        username: '{{ .username }}'
        password: '{{ .token }}'
  data:
    - secretKey: username
      remoteRef:
        key: github/fp-validated-docs
        property: username
    - secretKey: token
      remoteRef:
        key: github/fp-validated-docs
        property: token
