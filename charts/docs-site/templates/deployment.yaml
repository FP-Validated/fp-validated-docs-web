apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docs-site.fullname" . }}
  labels:
    {{- include "docs-site.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "docs-site.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "docs-site.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: nginx
          image: {{ printf "%s:%s" .Values.nginx.image.repository .Values.nginx.image.tag | quote }}
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.nginx.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: site-data
              mountPath: {{ .Values.site.dataDir }}
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
        - name: repo-sync
          image: {{ printf "%s:%s" .Values.sync.image.repository .Values.sync.image.tag | quote }}
          imagePullPolicy: {{ .Values.sync.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              repo_dir={{ .Values.site.repoDir | quote }}
              work_dir={{ .Values.site.workDir | quote }}
              revision_marker="$work_dir/.repo-revision"
              auth_url=$(printf '%s' "$REPO_URL" | sed "s#https://#https://$GIT_USERNAME:$GIT_TOKEN@#")
              mkdir -p "$work_dir"
              while true; do
                if [ ! -d "$repo_dir/.git" ]; then
                  rm -rf "$repo_dir"
                  git clone --depth 1 --branch "$REPO_BRANCH" "$auth_url" "$repo_dir"
                else
                  git -C "$repo_dir" fetch --depth 1 origin "$REPO_BRANCH"
                  git -C "$repo_dir" reset --hard "origin/$REPO_BRANCH"
                  git -C "$repo_dir" clean -fdx
                fi
                git -C "$repo_dir" rev-parse HEAD > "$revision_marker"
                sleep {{ .Values.repo.syncIntervalSeconds }}
              done
          env:
            - name: REPO_URL
              value: {{ .Values.repo.url | quote }}
            - name: REPO_BRANCH
              value: {{ .Values.repo.branch | quote }}
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "docs-site.runtimeSecretName" . }}
                  key: {{ .Values.repo.runtimeSecretKeys.username | quote }}
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "docs-site.runtimeSecretName" . }}
                  key: {{ .Values.repo.runtimeSecretKeys.token | quote }}
          resources:
            {{- toYaml .Values.sync.resources | nindent 12 }}
          volumeMounts:
            - name: repo-workdir
              mountPath: {{ .Values.site.workDir }}
        - name: site-builder
          image: {{ printf "%s:%s" .Values.builder.image.repository .Values.builder.image.tag | quote }}
          imagePullPolicy: {{ .Values.builder.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              repo_dir={{ .Values.site.repoDir | quote }}
              site_dir={{ .Values.site.dataDir | quote }}
              repo_revision_file={{ printf "%s/.repo-revision" .Values.site.workDir | quote }}
              built_revision_file={{ .Values.site.revisionFile | quote }}
              cache_dir={{ .Values.site.npmCacheDir | quote }}
              mkdir -p "$site_dir" "$cache_dir"
              while true; do
                if [ -d "$repo_dir/.git" ] && [ -f "$repo_revision_file" ]; then
                  revision=$(cat "$repo_revision_file")
                  built_revision=""
                  if [ -f "$built_revision_file" ]; then
                    built_revision=$(cat "$built_revision_file")
                  fi
                  if [ "$revision" != "$built_revision" ]; then
                    npm --prefix "$repo_dir/scripts" ci --cache "$cache_dir"
                    npm --prefix "$repo_dir/website" ci --cache "$cache_dir"
                    npm --prefix "$repo_dir/website" run build
                    rm -rf "$site_dir"/*
                    cp -a "$repo_dir/website/build/." "$site_dir/"
                    printf '%s' "$revision" > "$built_revision_file"
                  fi
                fi
                sleep {{ .Values.repo.syncIntervalSeconds }}
              done
          resources:
            {{- toYaml .Values.builder.resources | nindent 12 }}
          volumeMounts:
            - name: repo-workdir
              mountPath: {{ .Values.site.workDir }}
            - name: site-data
              mountPath: {{ .Values.site.dataDir }}
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: repo-workdir
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "docs-site.fullname" . }}-repo-workdir
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: site-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "docs-site.fullname" . }}-site-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: nginx-config
          configMap:
            name: {{ include "docs-site.fullname" . }}-nginx
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
