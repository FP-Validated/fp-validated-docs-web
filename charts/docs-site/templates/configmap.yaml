apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "docs-site.fullname" . }}-nginx
  labels:
    {{- include "docs-site.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen {{ .Values.nginx.port }};
      server_name _;
      root {{ .Values.site.dataDir }};
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
